name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # 手动触发
  workflow_dispatch:

# 允许写入权限，部署需要
permissions:
  contents: read
  pages: write
  id-token: write

# 并发部署：新提交取消旧的未完成部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        # 优先用 lock 保证可复现。若因 npm 的 optional dependency 解析问题失败
        # （见 npm/cli#4828，跨平台原生模块如 @astrojs/compiler-binding-* 容易漏装），
        # 回退到 npm install 让 npm 按当前平台重新解析。
        run: npm ci || npm install --no-audit --no-fund

      - name: 诊断依赖树
        if: always()
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          echo "平台: $(uname -m) $(node -p 'process.platform')"
          npm ls astro @astrojs/compiler-binding 2>&1 | head -20 || true

      - name: 构建
        run: npm run build

      - name: 校验 SEO 与 base 路径
        run: |
          test -f dist/og.png || (echo "缺少 og.png" && exit 1)
          test -f dist/sitemap-index.xml || (echo "缺少 sitemap" && exit 1)
          test -f dist/robots.txt || (echo "缺少 robots.txt" && exit 1)
          grep -q 'rel="canonical"' dist/index.html || (echo "缺少 canonical" && exit 1)
          echo "SEO 产物检查通过"

      # 防止子路径部署的链接回归：href="{import.meta.env.BASE_URL}x" 不会求值
      - name: 校验 base 路径
        run: node scripts/check-base.mjs

      # 校验 IndexNow 推送清单：key 文件命名、兜底清单与实际页面一致
      - name: 校验 IndexNow 推送清单
        run: node scripts/check-indexnow.mjs

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # 显式命名，indexnow job 据此下载。不依赖 action 的默认 artifact 名。
          name: pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 部署成功后通知 Bing / Yandex / DuckDuckGo 等支持 IndexNow 的引擎。
  # 必须排在 deploy 之后 —— 协议要求搜索引擎能回访到 key 文件校验真伪。
  indexnow:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 脚本优先读 sitemap，需要 dist 才拿得到；传过来保证 URL 清单与产物一致。
      # 没有这一步也能跑（脚本有内置兜底清单），但 URL 来源会退化为硬编码。
      - uses: actions/download-artifact@v8
        with:
          name: pages-artifact
          path: ./dist

      - name: 推送 IndexNow
        run: node scripts/indexnow-push.mjs
